version = 1

[[annotations]]
path = [
  "*.md",
  "spec/*.md",
  "chart/README.md",
  "demo/**/*.md",
  "smart/**/*.md",
  "test/fhir/fixtures/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Royal College of Paediatrics and Child Health"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "vitest.config.js",
  "spec/npews-scoring-spec.json",
  "test/fhir/fixtures/*.json",
  "smart/fhir-sandbox/seed/*.json",
  "smart/fhir-sandbox/.env.example",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Royal College of Paediatrics and Child Health"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = [
  "reference-sources/*.pdf",
  "reference-sources/*.xlsx",
  "reference-sources/images/*.png",
  "demo/assets/*.svg",
  "smart/fhir-sandbox/www/favicon.png",
  "smart/fhir-sandbox/www/*.woff2",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Royal College of Paediatrics and Child Health"
