<!DOCTYPE html>
<html lang="en">
<!--
  EMBED EXAMPLE for <npews-chart>

  This page demonstrates the Web Component in a real host page: load one
  ES module, drop the element, set .data. No chart CSS link, no rendering
  API call.

  IMPORTANT: ES modules cannot be loaded over file:// - the browser
  blocks them with a CORS error. You MUST serve this page over HTTP.
  The quickest way is `s/up` (or `s/up demo`), then visit:

    http://localhost:8000/embed-example.html

  Or use any development web server you like, e.g.:

    npx live-server --port=8000
    python3 -m http.server 8000
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&lt;npews-chart&gt; embed example</title>
  <style>
    /* This page deliberately links NO chart CSS - the <npews-chart> element
       provides its own. Only this explanatory banner is styled here. */
    .embed-note {
      font-family: 'Lato', 'Noto Sans', 'Liberation Sans', sans-serif;
      max-width: 60rem;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      color: #0b0c0c;
    }
    .embed-note h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .embed-note p  { margin: 0.25rem 0; color: #505a5f; }
    .embed-note code {
      background: #f3f2f1; padding: 0.05rem 0.3rem; border-radius: 3px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="embed-note">
    <h1>Embedding <code>&lt;npews-chart&gt;</code></h1>
    <p>
      The chart below is a single custom element fed a JSON object. This page
      links no chart stylesheet and calls no rendering API &mdash; it just loads the
      module, drops the element, and sets <code>.data</code>.
    </p>
  </div>

  <npews-chart id="chart"></npews-chart>

  <script>
    // ES modules cannot be loaded from file:// - the browser blocks them
    // with a CORS error. If you see "Access to script at ... has been blocked
    // by CORS policy", you are opening this file directly instead of serving
    // it over HTTP. Fix: run `s/up` (or `s/up demo`) and visit
    // http://localhost:8000/embed-example.html, or use any web server.
    if (location.protocol === 'file:') {
      console.error(
        '[npews-chart] This page uses ES modules, which cannot be loaded over file://.\n' +
        'You are seeing a CORS error because the browser blocks module imports from the file protocol.\n' +
        'Fix: serve this page over HTTP using `s/up` or any web server, then visit\n' +
        'http://localhost:8000/embed-example.html'
      );
    }
  </script>

  <script type="module">
    // 1. Register the element (self-provisions its stylesheet + font).
    import './chart/npews-chart.js';
    // 2. Grab any patient + observations JSON. Here we borrow a demo scenario;
    //    in production this is your ObservationsObject (e.g. mapped from FHIR).
    import { SCENARIOS } from './scenarios.js';

    const scenario = SCENARIOS[0];
    document.getElementById('chart').data = {
      patient: scenario.patient,
      observations: scenario.observations,
    };
  </script>
</body>
</html>
