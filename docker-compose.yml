services:
  # Static demo app server using live-server. The chart component (chart/) and
  # the demo harness (demo/) are mounted as siblings under the served root so the
  # demo's `../chart/...` module imports resolve over HTTP exactly as on disk.
  demo:
    image: node:alpine
    working_dir: /app
    command: sh -c "npm install -g live-server && live-server --port=8000 --host=0.0.0.0 --no-browser"
    ports:
      - "8000:8000"
    volumes:
      - ./chart:/app/chart
      - ./demo:/app/demo
    container_name: digital-pews-demo
    restart: unless-stopped
