services:
  # Static demo app server using live-server. The demo harness (demo/) is served
  # at the root and the chart component (chart/) is mounted as a subdirectory, so
  # http://localhost:8000/ renders the demo (not a directory listing) and the
  # demo's `../chart/...` module imports resolve to /chart/... over HTTP.
  demo:
    image: node:alpine
    working_dir: /app
    command: sh -c "npm install -g live-server && live-server --port=8000 --host=0.0.0.0 --no-browser"
    ports:
      - "8000:8000"
    volumes:
      - ./demo:/app
      - ./chart:/app/chart
    container_name: digital-pews-demo
    restart: unless-stopped
